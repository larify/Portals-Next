services:
  portals:
    image: ghcr.io/larify/portals-next:latest
    container_name: portals
    restart: 'no'
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - portals-data:/app/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  portals-data:

networks:
  default:
    name: portals-next
