services:
  portals:
    image: ghcr.io/larify/portals-next:latest
    container_name: portals
    restart: 'no'
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - '${PORTALS_DATA_DIR:-./data}:/app/data'
    networks:
      portals-next:
        ipv4_address: ${PORTALS_IP_ADDR}

  migrate:
    image: ghcr.io/larify/portals-next:migrate-latest
    restart: 'no'
    env_file:
      - .env
    volumes:
      - '${PORTALS_DATA_DIR:-./data}:/app/data'
    networks:
      - portals-next

  redis:
    image: redis:7-alpine
    networks:
      - portals-next
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

networks:
  portals-next:
    external: true
    name: ${PORTALS_BRIDGE_NETWORK}
